<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة نبرس التعليمية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            width: 100%;
            max-width: 450px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        /* تنسيق الشعار (صورة البروفايل) */
        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #58a6ff;
            margin-bottom: 16px;
        }

        .title {
            font-size: 24px;
            color: #f0f6fc;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #8b949e;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-card {
            background-color: #21262d;
            color: #58a6ff;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 8px;
            border: 1px solid #30363d;
            font-weight: 600;
            transition: all 0.2s ease-in-out;
        }

        .link-card:hover {
            background-color: #1f6feb;
            color: #ffffff;
            border-color: #1f6feb;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- رابط صورة الشعار (يمكنك استبدال هذا الرابط برابط شعارك) -->
        <img class="avatar" src="https://github.com/Sakura8123.png" alt="شعار نبرس">

        <h1 class="title">منصة نبرس التعليمية</h1>
        <p class="subtitle">تعلَّم بذكاء، تقدَّم بثقة.</p>

        <div class="links">
            <a href="https://github.com/Sakura8123/nibras" class="link-card" target="_blank">💻 مستودع المشروع على GitHub</a>
            <a href="#" class="link-card">📚 الدروس والدورات</a>
            <a href="#" class="link-card">💬 مجتمع نبرس</a>
            <a href="#" class="link-card">📧 تواصل معنا</a>
        </div>
    </div>

</body>
</html>
